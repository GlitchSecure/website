---
layout: default
---


<div class="">
  <main class="mx-auto w-full max-w-7xl px-4 sm:px-6 lg:px-8">
    <div class="flex-shrink-0 pt-16">
      <img
        class="mx-auto h-12 w-auto"
        src="/assets/img/logo-icon-white.svg"
        alt="GlitcSecure"
      />
    </div>
    <div class="mx-auto max-w-xl py-16 sm:py-24">
      <div class="text-center">
        <p
          class="text-sm font-semibold uppercase tracking-wide text-indigo-600"
        >
          404 error
        </p>
        <h1
          class="mt-2 text-4xl font-extrabold tracking-tight text-gray-200 sm:text-5xl"
        >
          This page does not exist.
        </h1>
        <p class="mt-2 text-lg text-gray-300">
          The page you are looking for could not be found.
        </p>
      </div>
      <div class="mt-12">
        <h2 class="text-sm font-semibold uppercase tracking-wide text-gray-500">
          Popular pages
        </h2>
        <ul
          role="list"
          class="mt-4 divide-y divide-gray-200 border-t border-b border-gray-200"
        >
          {% for item in site.data.fourohfour %}
          <li class="relative flex items-start space-x-4 py-6">
            <div class="flex-shrink-0">
              <span
                class="flex h-12 w-12 items-center justify-center rounded-lg bg-indigo-50"
              >
                <!-- Heroicon name: outline/book-open -->
                <svg
                  class="h-6 w-6 text-indigo-700"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="none"
                  viewBox="0 0 24 24"
                  stroke="currentColor"
                  aria-hidden="true"
                >
                  <path
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="2"
                    d="{{ item.icon }}"
                  />
                </svg>
              </span>
            </div>
            <div class="min-w-0 flex-1">
              <h3 class="text-base font-medium text-gray-100">
                <span
                  class="rounded-sm focus-within:ring-2 focus-within:ring-violet-500 focus-within:ring-offset-2"
                >
                  <a href="{{ item.link }}" class="focus:outline-none">
                    <span class="absolute inset-0" aria-hidden="true"></span>
                    {{ item.title }}
                  </a>
                </span>
              </h3>
              <p class="text-base text-gray-300">{{ item.subtitle }}</p>
            </div>
            <div class="flex-shrink-0 self-center">
              <!-- Heroicon name: solid/chevron-right -->
              <svg
                class="h-5 w-5 text-gray-400"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20"
                fill="currentColor"
                aria-hidden="true"
              >
                <path
                  fill-rule="evenodd"
                  d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z"
                  clip-rule="evenodd"
                />
              </svg>
            </div>
          </li>
          {% endfor %}
        </ul>
        <div class="mt-8">
          <a
            href="#"
            class="text-base font-medium text-indigo-600 hover:text-violet-500"
            >Or go back home<span aria-hidden="true"> &rarr;</span></a
          >
        </div>
      </div>
    </div>
  </main>
</div>
