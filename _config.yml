title: GlitchSecure
description: "Automatically assess your security posture with continuous vulnerability assessments and real-time pentesting."
url: https://glitchsecure.com # where is the production site located?
companyname: GlitchSecure

paginate: 6
paginate_path: "/blog/page:num/"
show_drafts: false
paginate_path: "/blog/:num/"

# Social media links
social:
  twitter: glitchsecure
  linkedin: glitchsecure
  github: glitchsecure

permalink: "/blog/:title/"

plugins:
  - jekyll-feed
  - jekyll-postcss
  - jekyll-sitemap
  - jekyll-minifier
  - jekyll-paginate

postcss:
  cache: false

css_dir: "assets/css" # defaults to "css"

highlighter: rouge

collections:
  posts:
    output: true
    permalink: "/blog/:title"
  pages:
    output: true
    permalink: "/:title"

jekyll-minifier:
  exclude: "*.txt"
  exclude: ".well-known/security.txt"
  exclude: "publickey.asc"
  exclude: "feed.xml"
  exclude: "security.md"
  exclude: "assets/js/bundle.js"
  compress_css: false
  uglifier_args:
    harmony: true


jekyll_image_optim:
  image_optim:
    allow_lossy: true
    advpng:
      level: 2
    optipng:
      level: 2
# Enable these if you want extra optimization:
    pngout: false
    svgo: false

webrick:
  headers:
    Access-Control-Allow-Origin: "*"


exclude:
  - node_modules
  - vendor
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - postcss.config.js
  - README.md
  - tailwind.config.js
