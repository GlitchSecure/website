heading: "Frequently Asked Questions"
subheading: "Still have questions? Feel free to shoot us a message via live chat!"
items:
  - question: "What are the benefits of security testing credits?"
    answer: "When it comes to high quality security testing, the one-size-fits-all approach doesn't cut it. To address this at scale we use credits as a standardised unit of work effort required. Credits allow you to consistently scope assessments and ensure thorough coverage of your assets regardless of their size. When you purchase security testing credits your entire team gets access to our real-time testing platform, continuous security scanning, on-demand pentration testing, and free remediation testing for all identified vulnerabilities."

  - question: "What's the difference between a Vulnerability Assessment and a Pentest?"
    answer: 'A Vulnerability Assessment is a process for continually identifying vulnerabilities and weaknesses through the use of automated scanning tools. A Penetration Test is an on-demand test that mimics a real-world cyber attack using the same tools and techniques that modern adversaries use.'

  - question: "When can I get remediation testing?"
    answer: 'You can request remediation testing at any time through the platform. Once a patch is in place simply open the finding page and select "Request Remediation Test". Remediation testing is offered for a period of 1 year from the start date of your pentest or vulnerability assessment.'

  - question: "Will this help me with SOC 2, ISO/IEC 27001, and PCI-DSS Compliance?"
    answer: "Yes! We can fulfil regular interval <strong>vulnerability scanning</strong> and annual <strong>penetration testing requirements</strong> needed for compliance. Schedule an intro call with our team to learn more about how we can help you stay compliant."

  - question: "What types of pentesting do you offer?"
    answer: "We offer a full range of pentesting for a variety of targets including web applications, mobile and desktop applications, APIs, internal and external networks and cloud services."

  - question: "Will I get a traditional PDF report?"
    answer: "Yes! In addition to being able to view vulnerability findings in real-time on our dashboard, we also provide an always up-to-date PDF report that details all testing activity and finding statuses."

  - question: "Are credits refundable?"
    answer: "No, credits are non-refundable. Credits must be redeemed for services within 1 year of purchase. If an issue arises that prevents delivery of services you may contact us to discuss your options in accordance with our Terms of Service."

  - question: "Do you offer volume discounts?"
    answer: "We can offer volume discounts on purchases of 15 credits or more. Please contact us to discuss your needs."

  - question: "What payment methods do you accept?"
    answer: "We accept a variety of payment methods including direct debit, ACH Debit, PAD, and Interac e-transfer. We use GoCardless and Wise for payment processing and can accept payments from most regions."
