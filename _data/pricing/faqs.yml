heading: "Frequently Asked Questions"
subheading: "Still have questions? Feel free to shoot us a message via live chat!"
items:

  - question: "What's the difference between a Vulnerability Assessment and a Pentest?"
    answer: 'A Vulnerability Assessment is a process for continually identifying vulnerabilities and weaknesses through the use of automated scanning tools. A Penetration Test is an on-demand test that mimics a real-world cyber attack using the same tools and techniques that modern adversaries use.'

  - question: "When can I get remediation testing?"
    answer: 'You can request remediation testing at any time through the platform. Once a patch is in place simply open the finding page and select "Request Remediation Test". Remediation testing is offered for a period of 1 year from the start date of your pentest or vulnerability assessment.'

  - question: "Will this help me with SOC 2, ISO/IEC 27001, and PCI-DSS Compliance?"
    answer: "Yes! We can fulfil regular interval <strong>vulnerability scanning</strong> and annual <strong>penetration testing requirements</strong> needed for compliance. Schedule an intro call with our team to learn more about how we can help you stay compliant."

  - question: "What types of security testing do you offer?"
    answer: "We offer a full range of automated Vulnerability Assessment & Penetration Testing (VAPT) for a variety of targets including web applications, mobile and desktop applications, APIs, internal and external networks and cloud services."

  - question: "Will I get a traditional PDF report?"
    answer: "Yes! In addition to being able to view vulnerability findings in real-time on our dashboard, we also provide an always up-to-date PDF report that details all testing activity and finding statuses."

  - question: "Do you offer volume discounts?"
    answer: "We can offer volume discounts on vulnerability assessments of 15 targets or more. Please contact us to discuss your needs."

  - question: "What payment methods do you accept?"
    answer: "We accept a variety of payment methods including direct debit, ACH Debit, PAD, and Interac e-transfer. We use GoCardless and Wise for payment processing and can accept payments from most regions. <br> Additionally we are happy to invoice in CAD, AUD, EUR, and GBP using a set exchange rate."
