heading: "Frequently Asked Questions"
subheading: "Still have questions? Feel free to shoot us a message via live chat!"
items:
  - question: "When can I get remediation testing?"
    answer: 'You can request remediation testing at any time through the platform. Once a patch is in place simply open the finding page and select "Request Remediation Test". Remediation testing is offered for a period of 1 year from the start date of your pentest.'

  - question: "Will this help me with SOC-2, ISO, and PCI Compliance?"
    answer: "Yes! We can fulfil regular interval Vulnerability Assessment scanning and annual penetration testing requirements needed for compliance. Schedule an intro call with our team to learn more about how we can help you stay compliant."

  - question: "What types of pentesting do you offer?"
    answer: "We offer a full range of pentesting for a variety of targets including web applications, mobile and desktop applications, APIs, internal and external networks and cloud services."

  - question: "Will I get a traditional PDF report?"
    answer: "Yes! In addition to being able to view vulnerability findings in real-time on our dashboard we provide an always up-to-date PDF report that details all testing activity and finding status."

  - question: "Are credits refundable?"
    answer: "No, credits are non-refundable. Credits must be redeemed for services within 1 year of purchase. If an issue arises that prevents delivery of services you may contact us to discuss your options in accordance with our Terms of Service."

  - question: "Do you offer volume discounts?"
    answer: "We can offer volume discounts on purchases of 20 credits or more. Please contact us to discuss your needs."

  - question: "What payment methods do you accept?"
    answer: "We accept a variety of payment methods including direct debit, ACH, wire transfer, interac e-transfer, and credit card. We use Stripe, Paddle, and Wise for payment processing and can accept payments from most regions."
