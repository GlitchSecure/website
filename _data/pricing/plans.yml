- name: Vulnerability Assessment
  subtitle: For small apps
  key: vulnerability_assessment
  description: "Get recurring vulnerability scans of your web application or network to identify vulnerabilities before hackers find them, and automatically verify applied patches. Scans are run on a monthly basis with findings verified by expert hackers."
  base_credits: 1
  max_credits: 3
  features:
    - key: get_continuous_results

    - key: built_by_hackers

    - key: zero_false_positives

    - key: compliance_requirements

    - key: applications
      base: 1
      increment: 1
      max: 3

    - key: user-roles
      base: 1
      increment: 3
      max: 7

    - key: external-ips
      base: 16
      increment: 16
      max: 48

- name: Targeted Pentest
  subtitle: Perfect for startups
  key: targeted
  description: "Go beyond fulfilling compliance requirements and integrate pentesting into your SDLC. Use this agile approach to proactively identify vulnerabilities in new releases and specific functions, or when the next major vulnerability (like log4j) is published."
  base_credits: 2
  max_credits: 4
  features:
    - key: get_continuous_results

    - key: targeted_vulnerability_testing

    - key: test_new_features

    - key: applications
      base: 1
      increment: 0
      max: 1

    - key: user-roles
      base: 1
      increment: 0
      max: 1

    - key: api-endpoints
      base: 16
      increment: 16
      max: 32

    - key: external-ips
      base: 16
      increment: 16
      max: 32

- name: "In-depth Pentest"
  subtitle: When you just need more
  key: indepth
  description: "Get an in-depth look at your enite application, API, or network through an in-depth human powered penetration test. Meet compliance requirements and ensure full coverage with standards like the OWASP Application Secuirty Verification Standard."
  base_credits: 3
  max_credits: 6
  features:
    - key: continuous_testing

    - key: get_continuous_results

    - key: compliance_requirements

    - key: applications
      base: 1
      increment: 1
      max: 4

    - key: user-roles
      base: 1
      increment: 3
      max: 7

    - key: api-endpoints
      base: 32
      increment: 32
      max: 128

    - key: external-ips
      base: 32
      increment: 32
      max: 128
