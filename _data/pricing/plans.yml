  key: targeted
  description: "Go beyond fulfilling compliance requirements and integrate pentesting into your SDLC. Use this agile approach to proactively <span class=\"font-semibold\">identify vulnerabilities in new releases and specific functions</span>, or when the next major zero-day vulnerability (like log4j) is published."
  base_credits: 2
  max_credits: 3
  features:
