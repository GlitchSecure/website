- name: Continuous Vulnerability Assessment
  subtitle: For small apps
  key: vulnerability_assessment
  description: "Get recurring <span class=\"font-semibold\">vulnerability scans</span> of your web application or network to identify vulnerabilities before hackers find them. Ensure fixes are validated with free remediation testing. Scans are run on a quarterly basis and <span class=\"font-semibold\">verified by expert hackers to eliminate false positives</span>."
  base_credits: 1
  max_credits: 3
  features:
    - key: sidebar_vuln_scan

    - key: sidebar_continuous_testing
      base: 12
      increment: 0
      max: 12

    - key: sidebar_vulnerability_compliance

    - key: sidebar_zero_false_positives

    - key: sidebar_applications
      base: 1
      increment: 1
      max: 3

    - key: sidebar_user-roles
      base: 1
      increment: 1
      max: 3

    - key: sidebar_external-ips
      base: 16
      increment: 16
      max: 48

    - key: expert_hacker_insights

    - key: get_continuous_results

    - key: zero_false_positives

    - key: vulnerability_compliance

    - key: test_new_features

    - key: targeted_vulnerability_testing

- name: "On-demand (Targeted) Pentest"
