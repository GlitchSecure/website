sections:
  - title: Standards
    subtitle: "We are pursuing certifications and building to their specifications. By starting with clear principles and frameworks, our policies and processes reflect a thoughtful approach to security and our everyday work."
    icon: "M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"
    list:
      - item: "OWASP ASVS"
      - item: "NIST CSF"
      - item: "SOC 2"

  - title: Encryption
    subtitle: "Working with up-to-date framework releases, we use tried and tested modules, and apply fundamental security considerations to every aspect of our software design. Additionally we apply a second layer of encryption to sensitive data such as vulnerability details."
    icon: "M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"
    list:
      - item: "Encryption is used throughout our application"
      - item: "All data is encrypted in transit "
      - item: "All databases and database backups are encrypted at rest"

  - title: "Access Controls"
    subtitle: "We limit access to our systems and our data to only those who need it, operating on the principle of least privilege.  "
    icon: "M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"
    list:
      - item: "Unique logins required for all business critical systems"
      - item: "Defined access to different parts of our system"
      - item: "Customer and personal data access is limited by roles"

  - title: "Secure Servers"
    subtitle: "Your data is securely backed up on a regular basis. And we never move user data out of the secured environment for testing or any other reason."
    icon: "M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"
    list:
      - item: "SOC 1,2,3"
      - item: "ISO 27001/27017/27018 "
      - item: "PCI-DSS"

  - title: "Monitoring"
    subtitle: "Building a secure Site and Platform are only the beginning.  We monitor our systems to keep them secure and to continuously improve our people, processes and our product."
    icon: "M8 16l2.879-2.879m0 0a3 3 0 104.243-4.242 3 3 0 00-4.243 4.242zM21 12a9 9 0 11-18 0 9 9 0 0118 0z"
    list:
      - item: "Continuous resource and infrastructure access monitoring"
      - item: "Third party web property scanning"
      - item: "Security testing as an essential part of our release process"

  - title: "Engagement"
    subtitle: "If you have any questions or feedback about our security —including reporting any known suspected security incidents or vulnerabilities— please reach out to us."
    icon: "M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"
    list:
      - item: "We activly work with the cyber security community"
      - item: "We're always open to feedback"
      - item: "Found a vulnerability? Report it to security@glitchsecure.com"
