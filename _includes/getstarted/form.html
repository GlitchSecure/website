<div class="container max-w-2xl pt-24 lg:pt-48" x-show="getstartedFormOpen">
  <div class="flex flex-wrap items-center">
    <div class="w-full px-4 w-full">
      <!-- Cal inline embed code begins -->
      <div class="text-center mx-auto mb-12">
      <h1
        class="text-4xl font-extrabold leading-snug tracking-tight text-gray-200 md:text-6xl"
      >
      Get started!
      </h1>
      <noscript>
        <p class="text-gray-200">This page requires JavaScript to function properly.</p>
      </noscript>
      </div>
      <form action="javascript:void(0)" class="grid grid-cols-1 gap-y-6">
      <div>
        <label for="full-name" class="sr-only">Full name</label>
        <input type="text" name="full-name" id="full-name" autocomplete="name" class="block w-full shadow-sm py-3 px-4 placeholder-gray-500 focus:ring-indigo-500 focus:border-indigo-500 border-gray-300 rounded-md" placeholder="Your Name" x-data="{ name: localStorage.getItem('getstarted-name') }" x-init="$watch('name', (val) => localStorage.setItem('getstarted-name', val))" x-model="name">
      </div>
      <div>
        <label for="company" class="sr-only">Company</label>
        <input type="text" name="company" id="company" autocomplete="company" class="block w-full shadow-sm py-3 px-4 placeholder-gray-500 focus:ring-indigo-500 focus:border-indigo-500 border-gray-300 rounded-md" placeholder="Company" x-data="{ company: localStorage.getItem('getstarted-company') }" x-init="$watch('company', (val) => localStorage.setItem('getstarted-company', val))" x-model="company">
      </div>
      <div>
        <label for="email" class="sr-only">Email</label>
        <input type="text" name="email" id="email" autocomplete="email" class="block w-full shadow-sm py-3 px-4 placeholder-gray-500 focus:ring-indigo-500 focus:border-indigo-500 border-gray-300 rounded-md" placeholder="Email" x-data="{ email: localStorage.getItem('getstarted-email') }" x-init="$watch('email', (val) => localStorage.setItem('getstarted-email', val))" x-model="email">
      </div>
      <span class="my-2 border-t border-dashed border-neutral-200 dark:border-neutral-700"></span>
      <div class="mx-auto">

        <button @click="getstartedFormOpen = false; getstartedCalendarOpen = true;getstarted();return false;"
        class="mb-3 mr-1 inline-flex rounded-lg bg-neutral-100 py-3 px-6 text-base md:py-4 md:px-12 md:text-2xl font-medium text-black transition hover:bg-opacity-90">Next</button>
      </div>
    </form>
    </div>
  </div>
</div>
