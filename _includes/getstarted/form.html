<div class="w-full mx-auto px-4 max-w-2xl pt-24 lg:pt-48" x-show="getstartedFormOpen">
  <div class="flex flex-wrap items-center">
    <div class="w-full px-4 w-full">
      <!-- Cal inline embed code begins -->
      <div class="text-center mx-auto mb-12">
      <h1
        class="text-4xl font-extrabold leading-snug tracking-tight text-gray-200 md:text-6xl"
      >
      Let's get this <br>pentest started!
      </h1>
      </div>
      <form action="javascript:void(0)" @submit="getstartedFormOpen = false; getstartedCalendarOpen = true;getstarted(); plausible('Get Started Submission', {props: {method: 'Get Started Form'}})" class="grid grid-cols-1 gap-y-6">
      <div class="flex justify-start items-center relative">
        <label for="full-name" class="sr-only">Full name</label>
        <input type="text" name="full-name" id="full-name" autocomplete="name" class="block w-full shadow-sm py-3 pl-8
        placeholder-neutral-400 focus:ring-neutral-900 focus:border-neutral-900 border-gray-300 dark:bg-neutral-900 dark: dark:placeholder-neutral-300 dark:text-neutral-300 dark:focus:ring-neutral-300 dark:focus:border-neutral-300 dark:border-gray-600 rounded-md" placeholder="Your Name" x-data="{ name: localStorage.getItem('getstarted-name') }" x-init="$watch('name', (val) => localStorage.setItem('getstarted-name', val))" x-model="name" required>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute ml-2 text-neutral-500 dark:text-neutral-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
      </div>
      <div class="flex justify-start items-center relative">
        <label for="email" class="sr-only">Email</label>
        <input type="email" name="email" id="email" autocomplete="email" class="block w-full shadow-sm py-3 pl-8 placeholder-neutral-400 focus:ring-neutral-900 focus:border-neutral-900 border-gray-300 dark:bg-neutral-900 dark: dark:placeholder-neutral-300 dark:text-neutral-300 dark:focus:ring-neutral-300 dark:focus:border-neutral-300 dark:border-gray-600 rounded-md" placeholder="Email" x-data="{ email: localStorage.getItem('getstarted-email') }" x-init="$watch('email', (val) => localStorage.setItem('getstarted-email', val))" x-model="email" required>
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute ml-2 text-neutral-500 dark:text-neutral-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>
      </div>
      <div class="flex justify-start items-center relative">
        <label for="company" class="sr-only">Company</label>
        <input type="text" name="company" id="company" autocomplete="company" class="block w-full shadow-sm py-3 pl-8 placeholder-neutral-400 focus:ring-neutral-900 focus:border-neutral-900 border-gray-300 dark:bg-neutral-900 dark: dark:placeholder-neutral-300 dark:text-neutral-300 dark:focus:ring-neutral-300 dark:focus:border-neutral-300 dark:border-gray-600 rounded-md" placeholder="Company" x-data="{ company: localStorage.getItem('getstarted-company') }" x-init="$watch('company', (val) => localStorage.setItem('getstarted-company', val))" x-model="company">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 absolute ml-2 text-neutral-500 dark:text-neutral-300" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" /></svg>
      </div>
      <div class="mx-auto text-center">
        <p class="text-gray-200">By clicking next, you agree to our <a href="/legal/privacy/" class="hover:underline">privacy policy</a>.</p>
        <noscript>
          <p class="text-gray-200 mt-4">This page requires JavaScript to function properly.</p>
        </noscript>
      </div>
      <span class="my-2 border-t border-dashed border-neutral-200 dark:border-neutral-700"></span>
      <div class="mx-auto text-center">

        <button type="submit"
        class="mb-3 mr-1 inline-flex rounded-lg bg-neutral-100 py-3 px-6 text-base md:py-4 md:px-12 md:text-2xl font-medium text-black transition hover:bg-opacity-90">Next</button>
      </div>
    </form>
    </div>
  </div>
</div>
