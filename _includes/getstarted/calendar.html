<div class="container max-w-7xl pt-24 lg:pt-48" x-show="getstartedCalendarOpen" style="display: none">
  <div class="flex flex-wrap items-center">
    <div class="w-full px-4 lg:w-1/3">
      <div class="">
        <h1
          class="text-2xl font-extrabold leading-snug tracking-tight text-gray-200 md:text-left md:text-4xl"
        >
          Thanks for your interest!
        </h1>
        <p
          class="mb-8 max-w-xl text-sm text-gray-100 md:text-left md:text-xl min-w-[416px]"
        >
          We would love to setup a short call to learn about your company and discuss whether GlitchSecure would be a good fit for your business. Please select a time that works best for you.
        </p>
      </div>
    </div>
    <div class="w-full px-4 lg:block lg:w-2/3 ">
      <!-- Cal inline embed code begins -->
      <div class="w-full h-full" id="my-cal-inline"></div>
      <script type="text/javascript">
        var getstarted_loaded = false;

        function getstarted() {
          if (!getstarted_loaded) {
            getstarted_loaded = true;
            (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; typeof namespace === "string" ? (cal.ns[namespace] = api) && p(api, ar) : p(cal, ar); return; } p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
            Cal("init", {origin:"https://app.cal.com"});

            Cal("inline", {
              elementOrSelector:"#my-cal-inline",
              calLink: "team/glitchsecure/intro",
              config: {
                name: localStorage.getItem('getstarted-name'), // Prefill Name
                email: localStorage.getItem('getstarted-email'), // Prefill Email
                company: localStorage.getItem('getstarted-company'), // Prefill Email
              },
            });

            Cal("ui", {"styles":{"branding":{"brandColor":"#000000"}}});
          }
        }
      </script>
      <!-- Cal inline embed code ends -->
    </div>
  </div>
</div>
