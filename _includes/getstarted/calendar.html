<div class="w-full mx-auto px-4 max-w-7xl pt-24 lg:pt-48" x-show="getstartedCalendarOpen" style="display: none">
  <div class="flex flex-wrap items-center">
    <div class="w-full px-4 lg:w-1/3">
      <div class="">
        <h1
          class="text-2xl font-extrabold leading-snug tracking-tight text-gray-200 md:text-left md:text-4xl"
        >
          Let's chat!
        </h1>
        <p
          class="mb-8 max-w-xl text-sm text-gray-100 md:text-left md:text-xl xl:min-w-[416px]"
        >
          Let's find a time to have a short call, learn about your company, and discuss how GlitchSecure can help you test your security. Please select a time that works best for you.
        </p>
      </div>
    </div>
    <div class="w-full px-4 lg:block max-w-lg mx-auto">
      <div class="w-full h-full" id="booking-page"></div>
      <script type="text/javascript">
        var getstarted_loaded = false;

        function getstarted() {
          if (!getstarted_loaded) {
            getstarted_loaded = true;

            // Start embed script

            window.SavvyCal=window.SavvyCal||function(){(SavvyCal.q=SavvyCal.q||[]).push(arguments)};

            eval('var a=document.createElement(\'script\');a.src=\'https://embed.savvycal.com/v1/embed.js\';document.head.appendChild(a)')

            SavvyCal('init');
            SavvyCal('inline', { link: 'glitchsecure/intro', selector: '#booking-page', email: localStorage.getItem('getstarted-email'), displayName: localStorage.getItem('getstarted-name') });

            // End embed script
          }


          // Send POST request with form data
          let xhr = new XMLHttpRequest();
                    xhr.open("POST", "https://submit.glitchsecure.com/getstarted.php");
                    xhr.setRequestHeader("Accept", "application/json");
                    xhr.setRequestHeader("Content-Type", "application/json");

                    xhr.onload = () => console.log(xhr.responseText);

                    let data = {
                     name: localStorage.getItem('getstarted-name'), // Prefill Name
                     email: localStorage.getItem('getstarted-email'), // Prefill Email
                     company: localStorage.getItem('getstarted-company'), // Prefill Email
                    };

                    xhr.send(JSON.stringify(data));

        }
      </script>
    </div>
  </div>
</div>
