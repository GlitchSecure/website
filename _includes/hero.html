

<!-- ====== Hero Section Start -->
<div
  x-data="
    {
      videoOpen: false,
      bookingOpen: false
    }
  "
  class="relative pb-12 bg-gradient-to-br from-[#6540b0] via-[#5720c8] to-[#461AA0]"
>


<img class="opacity-[0.2] w-full h-full absolute object-cover object-center" src="/assets/img/home/herobg3.png">
  {%- include nav.html -%}

  <div class="max-w-7xl container pt-6 lg:pt-12">
    <div class="flex flex-wrap items-center">
      <div class="w-full lg:w-1/2 px-4 pt-32">
        <div class="hero-content animate-fadeIn">
          <h1
            class="
              text-gray-200
              font-extrabold
              text-4xl
              md:text-left
              md:text-6xl
              leading-snug
              tracking-tight
              md:mb-32
              mb-4
            "
          >
            {{ page.title }}
          </h1>
        </div>
      </div>
      <div class="w-full lg:w-1/2 px-4">
        <div class="hero-content animate-fadeIn">
          <p class="text-sm md:text-xl mb-8 text-gray-100 max-w-xl md:text-left">
            {{ page.subtitle }}
          </p>
          {% if page.hero-button %}
          <div class="md:flex flex-wrap mb-7">
            <a href="{{ page.hero-button-link }}"
             @click="{{ page.hero-button-click }}"
               class="
               inline-flex
               text-base
               font-medium
               text-black
               bg-neutral-100
               rounded-lg
               hover:bg-opacity-90
               py-3
               px-6
               transition
               mb-3
               mr-1
               "
               >
            {{ page.hero-button }}
            </a>
               </div>
               {% endif %}
        </div>
      </div>
    </div>
  </div>
  {% include home/booking-modal.html %}
</div>
<figure class="w-full h-32 -mt-32 bg-white" style="clip-path: polygon(0% 100%, 100% 40%, 101% 101%, 0% 100%);">
</figure>
