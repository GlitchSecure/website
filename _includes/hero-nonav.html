<!-- ====== Hero Section Start -->
<div
  class="{% if page.hero-wrapper-padding %} {{ page.hero-wrapper-padding }} {% else %} pb-12 {% endif %} relative bg-gradient-to-br from-hero-gradient-left via-glitchsecure-purple to-hero-gradient-right dark:bg-gradient-to-br dark:from-glitchsecure-purple-dark dark:via-hero-gradient-middle-dark dark:to-hero-gradient-right-dark"
>
  <img
    class="absolute block h-full w-full object-cover object-center opacity-[0.2] dark:hidden"
    src="/assets/img/home/herobg-light.png"
  />
  <img
    class="absolute hidden h-full w-full object-cover object-center opacity-[0.2] dark:block"
    src="/assets/img/home/herobg-dark.png"
  />
  <!-- ====== Navbar Section Start -->
  <header
    x-data="
    {
      navbarOpen: false,
      submenuOpen: false
    }
  "
    class="flex w-full items-center bg-transparent relative z-20 lg:pt-4"
  >
    <div class="w-full mx-auto px-4 max-w-7xl animate-fadeIn">
      <div class="relative flex items-center justify-between">
        <div class="w-96 max-w-full px-4 text-1xl md:text-3xl whitespace-nowrap">
          <a
            href="/"
            class="block w-full py-5 text-white flex items-center"
          >
          <img
            src="/assets/img/logo.svg"
            alt="logo"
            class="w-6 md:w-8 inline mr-1.5"
          />
            <span class="font-semibold">GLITCH</span>SECURE
          </a>
        </div>
        <div class="flex w-full items-center justify-between px-4">


        </div>
      </div>
    </div>
  </header>
  <!-- ====== Navbar Section End -->


  <div class="w-full mx-auto px-4 max-w-7xl pt-6 lg:pt-12 lg:mb-0">
    <div class="{% if page.hero-vertical %}flex flex-col text-center {% else %}flex flex-wrap lg:flex-nowrap md:text-left {% endif %}items-center pt-12 pb-12">
      <div class="w-full px-4 lg:w-1/2">
        <div class="animate-fadeIn">
          <h1 class="mb-4 text-4xl font-extrabold leading-snug tracking-tight text-gray-200 md:mb-12 md:text-6xl">
            {% if page.hero-title %}
            {{ page.hero-title }}
            {% else %}
            {{ page.title }}
            {% endif %}
          </h1>
        </div>
      </div>
      <div class="w-full px-4 lg:w-1/2 {% if page.hero-vertical != true %}lg:pl-16{% endif %}">
        <div class="animate-fadeIn">
          <p
            class="text-sm text-gray-200 mb-4 md:mb-8 lg:mb-16 md:text-xl"
          >
            {{ page.subtitle }}
          </p>
          {% if page.hero-button %}
          <div class="mb-7 flex-wrap md:flex">
            <a
              href="{{ page.hero-button-link }}"
              @click="{{ page.hero-button-click }}"
              class="mb-3 mr-1 inline-flex rounded-lg bg-neutral-100 py-3 px-6 text-base font-medium text-neutral-800 transition hover:bg-opacity-90"
            >
              {{ page.hero-button }}
            </a>
          </div>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</div>
