<!-- This example requires Tailwind CSS v2.0+ -->
<div class="py-12 bg-white">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="lg:text-center">
      <h2 class="text-base text-indigo-600 font-semibold tracking-wide uppercase">{{ page.subtitle }}</h2>
      <p class="mt-2 text-3xl leading-8 font-extrabold tracking-tight text-gray-900 sm:text-4xl">{{ page.title }}</p>
      <p class="mt-4 text-xl text-gray-500 lg:mx-auto">{{ page.description }}</p>
    </div>

    <div class="mt-10">
      <dl class="space-y-10 md:space-y-0 md:grid md:grid-cols-2 md:gap-x-8 md:gap-y-10">
        {% for item in site.data.security.features.sections %}
        <div>
        <dt>
          <div class="flex items-center justify-center h-32 w-32 rounded-md bg-transparent text-black">
            <!-- Heroicon name: outline/globe-alt -->
            <svg class="h-32 w-32 -ml-12" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" aria-hidden="true">
              <path stroke-linecap="round" stroke-linejoin="round" d="{{ item.icon }}" />
            </svg>
          </div>
          <p class="mt-5 text-lg leading-6 font-medium text-gray-900">{{ item.title }}</p>
        </dt>
        {% for entry in item.list %}
          <li>{{ entry.item }}</li>
        {% endfor %}
        <dd class="mt-2 text-base text-gray-500">{{ item.subtitle }}</dd>
      </div>
      {% endfor %}
      </dl>
    </div>
    <div class="text-center text-gray-900 mt-16">
    
    </div>
  </div>
</div>
