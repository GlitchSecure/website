<div class="bg-white dark:bg-glitchsecure-purple-medium pt-16">
  <div class="mx-auto px-4 max-w-7xl sm:px-6 lg:px-8">
    <div class="space-y-12">
      <h2 id="reviews" class="text-neutral-900 dark:text-neutral-200 text-3xl font-extrabold tracking-tight sm:text-4xl">
        {{ page.clients-title }}
      </h2>
      <div class="mx-auto mt-10 grid max-w-lg grid-cols-4 items-center gap-x-8 gap-y-10 sm:max-w-xl sm:grid-cols-6 sm:gap-x-10 lg:mx-0 lg:max-w-none lg:grid-cols-6">
        {% for item in site.data.home.clients %}
        <div class="col-span-2 lg:col-span-1 flex justify-center p-8">
          <img class="max-h-12 opacity-75 dark:hidden" src="/assets/img/clients/{{ item.name | slugify }}.svg" alt="{{ item.name }}" />
          <img class="max-h-12 opacity-75 dark:block hidden" src="/assets/img/clients/{{ item.name | slugify }}-dark.svg" alt="{{ item.name }}" />
        </div>
        {% endfor %}
      </div>
  </div>
</div>
