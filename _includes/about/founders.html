<div class="bg-white dark:bg-glitchsecure-purple-medium pt-16">
  <div class="mx-auto px-4 max-w-7xl sm:px-6 lg:px-8">
    <div class="space-y-12">
      <h2 class="text-neutral-900 dark:text-neutral-200 text-3xl font-extrabold tracking-tight sm:text-4xl">
        {{ page.founders-title }} <glitch class="z-10 layers" data-text="{{ page.founders-title-glitch }}"><span>{{ page.founders-title-glitch }}</span></glitch>
      </h2>
      <p class="text-neutral-900 dark:text-neutral-200 text-lg tracking-tight sm:text-xl">{{ page.founders-text }}</p>
      <ul role="list" class="mx-auto mt-20 grid max-w-2xl grid-cols-1 gap-x-6 gap-y-20 sm:grid-cols-2 lg:max-w-4xl lg:gap-x-8 xl:max-w-none">
        <li class="flex flex-col gap-6 xl:flex-row">
          <img class=" w-52 flex-none rounded-2xl object-cover" src="/assets/img/about/team/jade.jpg" alt="A pixelated photo of Jade">
          <div class="flex-auto">
            <h3 class="text-lg font-semibold leading-8 tracking-tight text-neutral-900 dark:text-neutral-200">Jade "<glitch class="z-10 layers" data-text="GlitchWitch"><span>GlitchWitch</span></glitch>" Null <span class="text-sm font-light pl-1">({{ page.jade-pronouns }})</span></h3>
            <p class="text-base leading-7 text-neutral-600 dark:text-neutral-400">{{ page.jade-title }}</p>
            <p class="mt-6 text-base leading-7 text-neutral-600 dark:text-neutral-300">{{ page.jade-bio }}</p>
          </div>
        </li>
        <li class="flex flex-col gap-6 xl:flex-row">
          <img class=" w-52 flex-none rounded-2xl object-cover" src="/assets/img/about/team/aaron.jpg" alt="A pixelated photo of Aaron">
          <div class="flex-auto">
            <h3 class="text-lg font-semibold leading-8 tracking-tight text-neutral-900 dark:text-neutral-200">Aaron Rasmussen <span class="text-sm font-light pl-1">({{ page.aaron-pronouns }})</span></h3>
            <p class="text-base leading-7 text-neutral-600 dark:text-neutral-400">{{ page.aaron-title }}</p>
            <p class="mt-6 text-base leading-7 text-neutral-600 dark:text-neutral-300">{{ page.aaron-bio }}</p>
          </div>
        </li>
      </ul>
    </div>
  </div>
</div>
