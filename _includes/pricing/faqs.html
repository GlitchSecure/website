<section class="px-4 sm:px-6 lg:px-8 pt-24 lg:pt-32">

  <div class="mx-auto max-w-4xl">
    <div class="divide-y-2 divide-gray-200">

      <div class="relative lg:text-center pb-10">
        <h1 class="font-bold text-neutral-700 dark:text-neutral-200 text-2xl sm:text-5xl">
          <span class="block lg:inline">{{ site.data.pricing.faqs.heading }}</span>
        </h1>
        <p class="mt-2 text-sm text-gray-500">
          {{ site.data.pricing.faqs.subheading }}
        </p>
      </div>

      <dl class="space-y-6 divide-y divide-gray-200">
        
        {% for faq in site.data.pricing.faqs.items %}

          <div x-data="{ open: false }" class="pt-6">
            <dt class="sm:text-lg">
              <button
                type="button"
                @click="open = !open"
                class="flex w-full items-start justify-between text-left text-gray-400"
                aria-expanded="false"
              >
                <span class="font-medium text-gray-900">
                  {{ faq.question }}
                </span>
                <span class="flex items-center h-7">
                  <svg x-bind:class="open ? '-rotate-180' : 'rotate-0'" class="h-5 w-5 transform transition-transform" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                  </svg>
                </span>
              </button>
            </dt>
            <dd class="mt-2 pr-12" id="faq-0" x-show="open" x-transition.size>
              <p class="text-base text-gray-500">
                {{ faq.answer }}
              </p>
            </dd>
          </div>

        {% endfor %}

      </dl>
    </div>
  </div>

</section>
