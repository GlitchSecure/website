<section class="relative bg-white mb-16 pt-16 pb-32 lg:pb-24 dark:bg-glitchsecure-purple-medium">

  <div class="mx-auto max-w-4xl px-4 sm:px-6 lg:px-8">
    <div>

      <div class="relative lg:text-center pb-10">
        <h1 class="font-bold text-neutral-700 dark:text-neutral-200 text-2xl sm:text-[2.8rem]">
          <span class="block lg:inline">
            {{ site.data.pricing.faqs.heading }}
          </span>
        </h1>
        <p class="mt-4 text-sm text-neutral-500 dark:text-neutral-400">
          {{ site.data.pricing.faqs.subheading }}
        </p>
      </div>

      <dl class="divide-y divide-neutral-200 dark:divide-neutral-700 border-y border-neutral-200 dark:border-neutral-700">

        {% for faq in site.data.pricing.faqs.items %}

          <div x-data="{ open: false }">
            <dt>
              <button
                type="button"
                @click="open = !open"
                class="flex w-full items-start justify-between text-left text-neutral-400 py-6"
                aria-expanded="false"
              >
                <span class="font-medium text-neutral-900 dark:text-neutral-200">
                  {{ faq.question }}
                </span>
                <span class="flex items-center h-7">
                  <svg x-bind:class="open ? '-rotate-180' : 'rotate-0'" class="h-5 w-5 transform transition-transform text-neutral-300 dark:text-neutral-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
                  </svg>
                </span>
              </button>
            </dt>
            <dd class="pr-12" id="faq-0" x-show="open" x-transition.size>
              <div class="text-base text-neutral-500 dark:text-neutral-400 pb-6">
                {{ faq.answer }}
              </div>
            </dd>
          </div>

        {% endfor %}

      </dl>
    </div>
  </div>

</section>
