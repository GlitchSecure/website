<ul role="list" class="divide-glitchsecure-400 divide-y border-y border-glitchsecure-400 mt-3">

  {% for feature in site.data.pricing.features %}
    <li x-show="isSelectedPlanFeature('{{ feature.key }}')" class="py-2 flex items-center">
      <span class="text-white opacity-60 flex-shrink-0">
        {% if feature.icon %}
          {{ feature.icon }}
        {% else %}
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
          </svg>
        {% endif %}
      </span>
      <span class="text-white ml-3 text-sm">
        {% if feature.increments %}
          {{ feature.prefix }}<span class="font-bold" x-text="incrementingFeatureValue('{{ feature.key }}')"></span>{{ feature.suffix }} {{ feature.name }}
        {% else %}
          {{ feature.name }}
        {% endif %}
      </span>
    </li>
  {% endfor %}

</ul>
