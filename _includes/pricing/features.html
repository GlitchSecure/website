<!-- This example requires Tailwind CSS v2.0+ -->
<div class="pt-24 lg:pt-32">
  <div class="bg-gray-50 py-24 lg:py-32">

    <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
      <dl class="lg:grid lg:grid-cols-3 lg:gap-10 -mx-10">
        
        {% for feature in site.data.pricing.plans.features %}
          <div
            x-data="{
              plans: [{% for planKey in site.data.pricing.plans.features[forloop.index0].plans %}'{{ planKey }}', {% endfor %}],
              get show() { return this.plans.includes(this.selectedPlanKey) },
            }"
            x-show="show"
          >
            <dt>
              <div class="flex h-12 w-12 items-center justify-center rounded-md bg-glitchsecure-500 text-white">
                <svg class="h-6 w-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
              </div>
              <p class="mt-5 text-lg font-medium leading-6 text-gray-900">
                {{ feature.name }}
              </p>
            </dt>
            <dd class="mt-2 text-base text-gray-500">
              {{ feature.description }}
            </dd>
          </div>
        {% endfor %}

      </dl>
    </div>
  </div>
</div>
