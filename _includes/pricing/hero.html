<div class="-mt-40">
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-lg overflow-hidden rounded-lg border-2 bg-white dark:bg-neutral-900 dark:border-glitchsecure-purple lg:flex lg:max-w-none">

      <div class="flex-1 px-6 py-8 lg:p-12">
        <h3 class="text-2xl font-bold text-neutral-900 dark:text-neutral-200 sm:text-3xl sm:tracking-tight">
          {{ page.credit-heading }}
        </h3>
        <p class="mt-6 text-base text-neutral-500 dark:text-neutral-400">
          {{ page.credit-description }}
        </p>
      </div>

      <div class="bg-neutral-50 dark:bg-neutral-800 py-8 px-6 text-center lg:flex lg:flex-shrink-0 lg:flex-col lg:justify-center lg:p-12">

        <div class="flex items-center justify-center text-5xl font-bold tracking-tight text-glitchsecure-purple-medium dark:text-neutral-200">
          <span>
            {{ page.credit-price }}
          </span>
          <span class="ml-3 text-xl font-light tracking-normal text-neutral-500 dark:text-neutral-300">
            {{ page.credit-price-currency }}
          </span>
        </div>

        <div class="text-md font-medium text-neutral-500">{{ page.credit-unit }}</div>

        <button
          type="button"
          @click="openGetStarted()"
          class="mt-3 bg-glitchsecure-purple text-white hover:bg-glitchsecure-purple-light block w-full py-3 px-8 border border-transparent rounded-md shadow-sm text-center font-medium"
        >
          Get Started
        </button>

      </div>
    </div>
  </div>
</div>
