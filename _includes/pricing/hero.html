<div x-data="{
  plans: [
    {
      name: 'Verified Automated Scan',
      description: 'Several DAST tool\'s run over the course of 5 days on a monthly cadence with results compiled into a single report, includes manual verification of all findings.',
      credits: 1,
      maxCredits: 3
    },
    {
      name: 'Targeted Pentest',
      description: 'A pentest that focuses on one specific feature, function, or test type over a single week. Includes a verified automated scan.',
      credits: 2,
      maxCredits: 4
    },
    {
      name: 'In-depth Pentest',
      description: 'A standard 2 week pentest with a configurable scope, remediation timeframe, and test coverage based on the number of credits.',
      credits: 3,
      maxCredits: 5
    }
  ],
  openGetStarted() {
    localStorage.clear()
    this.getstartedOpen = true
    plausible('Get Started Button', {props: {method: this.selectedPlan.name}});
  },
  selectedPlanId: 0,
  get selectedPlan() {
    return this.plans[this.selectedPlanId]
  },
}">

  <div class="-mt-40">
    <div class="relative mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
      <div class="mx-auto max-w-lg overflow-hidden rounded-lg shadow-lg lg:flex lg:max-w-none">

        <div class="flex-1 bg-white px-6 py-8 lg:p-12">
          <h3 class="text-2xl font-bold text-gray-900 sm:text-3xl sm:tracking-tight">What is a credit?</h3>
          <p class="mt-6 text-base text-gray-500">Lorem ipsum dolor sit amet consect etur adipisicing elit. Itaque amet indis perferendis blanditiis repellendus etur quidem assumenda.</p>
        </div>

        <div class="bg-gray-50 py-8 px-6 text-center lg:flex lg:flex-shrink-0 lg:flex-col lg:justify-center lg:p-12">
          
          <p class="text-lg font-medium leading-6 text-gray-900">Pay once, own it forever</p>
          
          <div class="mt-4 flex items-center justify-center text-5xl font-bold tracking-tight text-glitchsecure-600">
            <span>$3,300</span>
            <span class="ml-3 text-xl font-medium tracking-normal text-gray-500">USD</span>
          </div>

          <button
            type="button"
            @click="openGetStarted()"
            class="mt-6 flex items-center shadow w-full justify-center rounded-md border border-transparent bg-glitchsecure-800 px-5 py-3 text-base font-medium text-white hover:bg-glitchsecure-900"
          >
            Get Started
          </button>

        </div>
      </div>
    </div>
  </div>


  <div class="mt-24 relative bg-white dark:bg-glitchsecure-purple-medium">
    <div class="max-w-5xl mx-auto px-4 flex flex-col md:flex-row justify-center md:space-x-6 space-y-4 md:space-y-0">

      <div class="flex-1 flex flex-col">

        <template x-for="(plan, id) in plans" :key="plan.name">

          <button
            type="button"
            @click="selectedPlanId = id"
            x-bind:class="{
              'border-glitchsecure-500': selectedPlanId === id,
              'dark:border-gray-700 hover:border-glitchsecure-100 dark:hover:border-glitchsecure-800': selectedPlanId !== id,
              'mt-5': id > 0
            }"
            class="flex-1 flex items-center space-x-5 px-5 py-4 w-full cursor-pointer rounded-xl border-2 transition-colors"
          >

            <div class="flex-shrink">
              <svg
                x-bind:class="selectedPlanId === id ? 'text-glitchsecure-600' : 'text-gray-400'"
                class="w-5 h-5 sm:h-9 sm:w-9 transition-colors"
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 20 20" fill="currentColor"
              >
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd" />
              </svg>
            </div>

            <div class="flex flex-col items-start space-y-2 text-left">
              
              <h2 class="text-xl font-bold text-gray-700 dark:text-gray-200" x-text="plan.name"></h2>
              <div class="text-sm text-gray-700 dark:text-gray-200" x-text="plan.description"></div>
              
            </div>

            <div class="flex-1 flex flex-col items-end justify-end space-y-2">

              <h2
                x-bind:class="selectedPlanId === id ? 'text-glitchsecure-600' : 'text-gray-400'"
                class="transition-colors text-xl font-semibold sm:text-2xl whitespace-nowrap"
                x-text="(
                  plan.credits === 1
                    ? `${plan.credits} Credit`
                    : `${plan.credits} Credits`
                )"
              ></h2>

            </div>
            
          </button>

        </template>

      </div>

      <div class="bg-glitchsecure-700 dark:bg-glitchsecure-900 shadow-md p-5 rounded-lg">
        <div>
          <h3 class="text-white text-sm font-semibold uppercase tracking-wide">
            Features
          </h3>
        </div>
        <ul role="list" class="border-glitchsecure-200 divide-glitchsecure-400 mt-7 border-t divide-y lg:border-t-0">

          <template x-for="feature in [
            '2 Dedicated Researchers',
            '2 Week Annual Pentest',
            '131 Manual Tests Performed',
            '12 Months of Continuous Testing',
            'Satisfies SOC 2 Requirements',
            'Perfect for startups',
          ]" :key="feature">

            <li class="py-3 flex items-center">
              <svg class="text-white w-5 h-5 flex-shrink-0" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
                <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
              </svg>
              <span class="text-white ml-3 text-sm font-medium" x-text="feature"></span>
            </li>

          </template>

        </ul>

        <button
          @click="openGetStarted()"
          class="bg-glitchsecure-100 text-white hover:bg-glitchsecure-purple mt-6 w-full inline-block py-2 px-8 border border-transparent rounded-md shadow-sm text-center text-sm font-medium sm:mt-0 sm:w-auto lg:mt-6 lg:w-full"
        >
          Get Started
        </button>

      </div>
    </div>
  </div>

    {% include getstarted/modal.html %}
  </div>

</div>
