<div class="-mt-40">
  <div class="relative max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="mx-auto max-w-lg overflow-hidden rounded-lg border-2 lg:flex lg:max-w-none">

      <div class="flex-1 bg-white px-6 py-8 lg:p-12">
        <h3 class="text-2xl font-bold text-gray-900 sm:text-3xl sm:tracking-tight">
          {{ page.credit-heading }}
        </h3>
        <p class="mt-6 text-base text-gray-500">
          {{ page.credit-description }}
        </p>
      </div>

      <div class="bg-gray-50 py-8 px-6 text-center lg:flex lg:flex-shrink-0 lg:flex-col lg:justify-center lg:p-12">

        <div class="flex items-center justify-center text-5xl font-bold tracking-tight text-glitchsecure-600">
          <span>
            {{ page.credit-price }}
          </span>
          <span class="ml-3 text-xl font-medium tracking-normal text-neutral-400">
            {{ page.credit-price-currency }}
          </span>
        </div>

        <button
          type="button"
          @click="openGetStarted()"
          class="mt-6 flex items-center shadow w-full justify-center rounded-md border border-transparent bg-glitchsecure-800 px-5 py-3 text-base font-medium text-white hover:bg-glitchsecure-900"
        >
          Get Started
        </button>

      </div>
    </div>
  </div>
</div>
