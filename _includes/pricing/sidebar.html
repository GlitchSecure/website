<ul role="list" class="mt-3 border-b border-glitchsecure-purple-medium">
  {% for feature in site.data.pricing.sidebar %}
    <li x-show="isSelectedPlanFeature('{{ feature.key }}')" class="py-2 flex items-center border-t border-glitchsecure-purple-medium">
      <span class="text-white opacity-60 flex-shrink-0">
        {% if feature.icon %}
        <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
          <path fill-rule="evenodd" d="{{ feature.icon }}" clip-rule="evenodd"></path>
        {% else %}
          <svg class="w-5 h-5" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
          </svg>
        {% endif %}
      </span>
      <span class="text-white ml-3 text-sm">
        {% if feature.increments %}
          {{ feature.prefix }}
          <span class="font-bold" x-text="incrementingFeatureValue('{{ feature.key }}')"></span>{{ feature.suffix }}
          <span x-text="incrementingFeatureName('{{ feature.key }}', '{{ feature.unit }}', '{{ feature.unit-plural }}')"></span>
        {% else %}
          {{ feature.name }}
        {% endif %}
      </span>
    </li>
  {% endfor %}
</ul>
