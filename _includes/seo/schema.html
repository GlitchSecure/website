{% if page.url == '/' %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "Organization",
      "@id": {{ site.url | append: '/#organization' | jsonify }},
      "name": {{ site.companyname | jsonify }},
      "url": {{ site.url | append: '/' | jsonify }},
      "logo": {{ site.logo | absolute_url | jsonify }},
      "email": {{ site.email | jsonify }},
      "telephone": {{ site.phone | jsonify }},
      "address": {
        "@type": "PostalAddress",
        "streetAddress": {{ site.address.street | jsonify }},
        "addressLocality": {{ site.address.locality | jsonify }},
        "addressRegion": {{ site.address.region | jsonify }},
        "postalCode": {{ site.address.postal_code | jsonify }},
        "addressCountry": {{ site.address.country | jsonify }}
      },
      "sameAs": [
        {{ 'https://www.linkedin.com/company/' | append: site.social.linkedin | jsonify }},
        {{ 'https://github.com/' | append: site.social.github | jsonify }}
      ]
    },
    {
      "@type": "WebSite",
      "@id": {{ site.url | append: '/#website' | jsonify }},
      "url": {{ site.url | append: '/' | jsonify }},
      "name": {{ site.title | jsonify }},
      "publisher": {"@id": {{ site.url | append: '/#organization' | jsonify }}},
      "inLanguage": "en-CA"
    },
    {
      "@type": "WebPage",
      "@id": {{ site.url | append: '/#webpage' | jsonify }},
      "url": {{ site.url | append: '/' | jsonify }},
      "name": {{ page_title | strip | jsonify }},
      "description": {{ description | strip | jsonify }},
      "isPartOf": {"@id": {{ site.url | append: '/#website' | jsonify }}},
      "inLanguage": "en-CA"
    }
  ]
}
</script>
{% else %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@graph": [
    {
      "@type": "WebPage",
      "@id": {{ canonical_url | append: '#webpage' | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page_title | strip | jsonify }},
      "description": {{ description | strip | jsonify }},
      "isPartOf": {"@id": {{ site.url | append: '/#website' | jsonify }}},
      "inLanguage": "en-CA"
    }{% if page.layout == 'post' %},
    {
      "@type": "BlogPosting",
      "@id": {{ canonical_url | append: '#article' | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "headline": {{ page.title | jsonify }},
      "description": {{ description | strip | jsonify }},
      "image": {{ social_image_url | jsonify }},
      "datePublished": {{ page.date | date_to_xmlschema | jsonify }},
      "dateModified": {{ page.date_updated | default: page.date | date_to_xmlschema | jsonify }},
      "author": {
        "@type": {% if page.author contains 'GlitchSecure' %}"Organization"{% else %}"Person"{% endif %},
        "name": {{ page.author | jsonify }}
      },
      "publisher": {"@id": {{ site.url | append: '/#organization' | jsonify }}},
      "mainEntityOfPage": {"@id": {{ canonical_url | append: '#webpage' | jsonify }}},
      "inLanguage": "en-CA"
    }{% endif %}{% if page.schema_type == 'Service' %},
    {
      "@type": "Service",
      "@id": {{ canonical_url | append: '#service' | jsonify }},
      "url": {{ canonical_url | jsonify }},
      "name": {{ page_title | strip | jsonify }},
      "description": {{ description | strip | jsonify }},
      "serviceType": {{ page.service_type | jsonify }},
      "provider": {"@id": {{ site.url | append: '/#organization' | jsonify }}}{% if page.service_area %},
      "areaServed": {
        "@type": {{ page.service_area_type | default: 'Country' | jsonify }},
        "name": {{ page.service_area | jsonify }}
      }{% endif %}
    }{% endif %}
  ]
}
</script>
{% endif %}

{% if page.faq_schema %}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": {{ canonical_url | append: '#faq' | jsonify }},
  "url": {{ canonical_url | jsonify }},
  "mainEntity": [
    {% for item in site.data.pricing.faqs.items %}
    {
      "@type": "Question",
      "name": {{ item.question | strip_html | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.answer | strip_html | normalize_whitespace | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
{% endif %}
