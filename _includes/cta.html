
<div
  class="relative bg-glitchsecure-purple pb-12 dark:bg-glitchsecure-purple-dark"
  id="demo"
>
  <div
    class="mx-auto max-w-7xl py-24 px-4 sm:px-6 lg:flex lg:items-center lg:py-32 lg:px-8"
  >
    <div class="lg:w-0 lg:flex-1">
      <h2 class="text-3xl font-extrabold text-neutral-200 sm:text-4xl">
        {{ page.cta-title }}
      </h2>
      <p class="mt-3 max-w-3xl text-lg text-neutral-300">
        {{ page.cta-subtitle }}
      </p>
    </div>
    <div class="mt-8 lg:mt-0 lg:ml-8 max-w-md">
      <form action="{{ page.cta-button-link }}" class="sm:flex">
        <label for="email" class="sr-only">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          autocomplete="email"
          required
          class="w-full rounded-md border border-gray-300 px-5 py-3 placeholder-gray-400 shadow-sm focus:border-violet-500 focus:ring-1 focus:ring-violet-500 sm:max-w-xs"
          placeholder="Enter your email"
        />
        <div class="mt-3 rounded-md shadow sm:mt-0 sm:ml-3 sm:flex-shrink-0">
          <button
            type="submit"
            class="flex w-full items-center justify-center rounded-md border border-transparent bg-neutral-100 py-3 px-5 text-base font-medium text-neutral-800 hover:bg-neutral-200 focus:outline-none focus:ring-2 focus:ring-violet-500 focus:ring-offset-2"
          >
            {{ page.cta-button-text }}
          </button>
        </div>
      </form>
      <p class="mt-3 text-sm text-neutral-300">
        By entering your email, you agree to be contacted to discuss more in accordance with our <a href="/legal/privacy/" class="underline">privacy policy
        </a>
      </p>
    </div>
  </div>
</div>
