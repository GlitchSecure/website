<!-- ====== Services Section Start -->
<section
  class="relative bg-white pt-16 pb-32 lg:pb-24 dark:bg-glitchsecure-purple-medium lg:pb-24"
>
  <div class="w-full mx-auto px-4 max-w-7xl">
    <div class="flex flex-wrap">
      <div class="w-full px-4">
        <div class="mx-auto mb-12 max-w-5xl text-center lg:mb-20">
          <span
            class="mb-2 block text-lg font-semibold text-neutral-700 dark:text-neutral-200"
          >
            {{ page.process-title-small }}
          </span>
          <h2
            id="features"
            class="mb-4 text-3xl font-bold text-neutral-700 dark:text-neutral-200 sm:text-4xl"
          >
            {{ page.process-title }}
          </h2>
          <p class="text-2xl text-neutral-700 dark:text-neutral-200">
            {{ page.process-subtitle }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap justify-center">

      {% for item in site.data.home.features %}
      <div class="w-full px-4 sm:w-4/5 md:w-1/2 lg:w-1/2">
        <div
          class="group relative mb-8 rounded-xl border border-glitchsecure-purple bg-white p-4 text-left dark:bg-glitchsecure-purple-dark dark:border-glitchsecure-purple pb-16 md:py-8 md:px-8 lg:px-6 xl:p-10 2xl:p-8"
        >
          <dl class="grid grid-cols-1">
            <div class="relative pl-16 md:pl-32">
              <dt class="text-lg font-semibold leading-7 text-neutral-900 dark:text-neutral-200">
                <div class="absolute left-0 top-0 flex h-10 w-10 md:h-24 md:w-24 items-center justify-center rounded-lg bg-glitchsecure-purple">
                  <svg class="h-6 w-6 md:h-12 md:w-12 text-white" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="{{ item.icon }}" />
                  </svg>
                </div>
                {{ item.title }}
              </dt>
              <dd class="mt-2 text-base leading-7 text-neutral-600 dark:text-neutral-400">{{ item.subtitle }}
                <br><br>
                <a href="{{ item.url }}" class="text-glitchsecure-purple hover:underline font-light">Learn More -></a>
              </dd>
            </div>
          </dl>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ====== Services Section End -->
