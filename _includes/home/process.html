<!-- ====== Services Section Start -->
<section
  class="relative bg-white pt-16 pb-32 lg:pb-24 dark:bg-glitchsecure-purple-medium lg:pb-24"
>
  <div class="w-full mx-auto px-4 max-w-7xl">
    <div class="flex flex-wrap">
      <div class="w-full px-4">
        <div class="mx-auto mb-12 max-w-5xl text-center lg:mb-20">
          <span
            class="mb-2 block text-lg font-semibold text-neutral-700 dark:text-neutral-200"
          >
            {{ page.process-title-small }}
          </span>
          <h2
            id="features"
            class="mb-4 text-3xl font-bold text-neutral-700 dark:text-neutral-200 sm:text-4xl"
          >
            {{ page.process-title }}
          </h2>
          <p class="text-2xl text-neutral-700 dark:text-neutral-200">
            {{ page.process-subtitle }}
          </p>
        </div>
      </div>
    </div>

    <div class="flex flex-wrap justify-center">
      {% for item in site.data.home.features %}
      <div class="w-full px-4 sm:w-4/5 md:w-1/2 lg:w-1/3">
        <div
          class="group relative mb-8 rounded-xl border border-[#EFEFEF] bg-white p-10 text-left dark:bg-glitchsecure-purple-dark md:px-8 lg:py-9 lg:px-6 xl:p-10 2xl:p-12"
        >
          <div class="relative z-10 mx-auto mb-4 inline-flex h-11 items-center">
            <svg
              width="120"
              height="90"
              viewBox="0 0 49 35"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="{{ item.icon }}" fill="#5720c8" />
            </svg>
          </div>
          <h4
            class="mb-3 text-xl font-semibold text-neutral-700 dark:text-neutral-200"
          >
            {{ item.title }}
          </h4>
          <p class="h-32 text-neutral-700 dark:text-neutral-200">
            {{ item.subtitle }}
          </p>
        </div>
      </div>
      {% endfor %}
    </div>
  </div>
</section>
<!-- ====== Services Section End -->
