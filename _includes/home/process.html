<!-- ====== Services Section Start -->
<section class="relative pt-16 pb-12 lg:pb-24 bg-white dark:bg-glitchsecure-purple-medium">
   <div class="container max-w-7xl">
      <div class="flex flex-wrap">
         <div class="w-full px-4">
            <div class="text-center mx-auto mb-12 lg:mb-20 max-w-5xl">
               <span class="font-semibold text-lg text-neutral-700 dark:text-neutral-200 mb-2 block">
               {{ page.process-title-small }}
               </span>
               <h2 id="features"
                  class="
                  font-bold
                  text-3xl
                  sm:text-4xl
                  text-neutral-700
                  dark:text-neutral-200
                  mb-4
                  "
                  >
                  {{ page.process-title }}
               </h2>
               <p class="text-2xl text-neutral-700 dark:text-neutral-200">
                  {{ page.process-subtitle }}
               </p>
            </div>
         </div>
      </div>


      <div class="flex flex-wrap justify-center">
        {% for item in site.data.home.features %}
        <div class="w-full sm:w-4/5 md:w-1/2 lg:w-1/3 px-4">
           <div
              class="
              p-10
              md:px-8
              lg:py-9 lg:px-6
              xl:p-10
              2xl:p-12
              rounded-xl
              bg-white
              dark:bg-glitchsecure-purple-dark
              border border-[#EFEFEF]
              mb-8
              text-left
              group
              relative
              "
              >
              <div
                 class="
                 h-11
                 inline-flex
                 items-center
                 mb-4
                 relative
                 z-10
                 mx-auto
                 "
                 >
                 <svg
                    width="120"
                    height="90"
                    viewBox="0 0 49 35"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg"
                    >
                    <path
                       d="{{ item.icon }}"
                       fill="#5720c8"
                       />
                 </svg>
              </div>
              <h4 class="font-semibold text-xl text-neutral-700 dark:text-neutral-200 mb-3">
                 {{ item.title }}
              </h4>
              <p class="text-neutral-700 dark:text-neutral-200 h-32">
                 {{ item.subtitle }}
              </p>
           </div>
        </div>
         {% endfor %}
      </div>

   </div>
</section>
<!-- ====== Services Section End -->
