

<!-- ====== Hero Section Start -->
<div
  x-cloak x-data="
    {
      videoOpen: false
    }
  "
  class="relative pt-[120px] md:pt-[150px] lg:pt-[180px] pb-[110px] bg-gradient-to-br from-[#1d162b] via-[#240f4c] to-[#221243]"
>
  <div class="container">
    <div class="flex flex-wrap items-center">
      <div class="w-full lg:w-1/2 px-4">
        <div class="hero-content animate-fadeIn">
          <h1
            class="
              text-gray-200
              font-extrabold
              text-2xl
              text-center
              md:text-left
              md:text-4xl
              leading-snug
              tracking-tight
            "
          >
            {{ page.hero-title }}
          </h1><h2
          class="
            text-violet-600
            font-medium
            md:font-bold
            text-xl
            text-center
            md:text-left
            md:text-3xl
            leading-snug
          ">{{ page.hero-title-2 }}</h2>
          <h3
          class="
            text-violet-500
            md:font-medium
            text-lg
            text-center
            md:text-left
            md:text-2xl
            leading-tight
            tracking-tight
            mb-5
          ">{{ page.hero-title-3 }}</h3>
          <p class="text-sm md:text-xl mb-8 text-gray-100 max-w-xl               text-center
                        md:text-left">
            {{ page.hero-subtitle }}
          </p>
          <form class="hidden md:flex flex-wrap mb-7">
                  <input
                     type="email"
                     class="
                     sm:max-w-[220px]
                     md:max-w-[315px]
                     lg:max-w-[250px]
                     xl:max-w-[315px]
                     w-full
                     mr-3
                     mb-3
                     bg-zinc-900
                     rounded
                     border border-form-stroke
                     text-white
                     px-5
                     h-[50px]
                     text-sm
                     outline-none
                     focus:outline-indigo-500
                     focus-visible:shadow-none
                     focus:border-indigo-500
                     "
                     placeholder="Your work mail"
                     />
                  <button
                     class="
                     bg-gradient-to-br from-violet-500 to-violet-700
                     hover:bg-opacity-90
                     text-white text-sm
                     rounded
                     px-6
                     mb-3
                     h-[50px]
                     transition


                     "
                     >
                  {{ page.hero-button }}
                  </button>
               </form>
        </div>
      </div>
      <div class="w-full lg:w-6/12 px-4">
        <div class="text-right mx-auto">

   return new Promise(resolve => setTimeout(resolve, duration));
}
