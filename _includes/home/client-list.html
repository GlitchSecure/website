<div class="relative pt-16 pb-32 dark:bg-glitchsecure-purple-medium">
  <div class="mx-auto max-w-7xl px-4 text-center sm:px-6 lg:px-8">
    <p class="text-3xl font-bold text-neutral-700 dark:text-neutral-200 sm:text-4xl">
      {{ page.client-list-title}}
    </p>
    <div class="mt-6 grid grid-cols-2 gap-0.5 text-white md:grid-cols-4 lg:mt-8 lg:grid-cols-8">
      {% for item in site.data.home.clients %}
      <div class="col-span-1 flex justify-center p-8">
        <img class="max-h-12 opacity-75 dark:hidden" src="/assets/img/clients/{{ item.name}}.svg" alt="{{ item.alt}}" />
        <img class="max-h-12 opacity-75 dark:block hidden" src="/assets/img/clients/{{ item.name}}-dark.svg" alt="{{ item.alt}}" />
      </div>
      {% endfor %}
    </div>
  </div>
</div>
