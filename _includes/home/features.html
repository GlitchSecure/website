<!-- ====== Services Section Start -->
<section class="relative pb-12 lg:pb-[90px] bg-medium-purple">
   <div class="container">
      <div class="flex flex-wrap -mx-4">
         <div class="w-full px-4">
            <div class="text-center mx-auto mb-12 lg:mb-20 max-w-5xl">
               <span class="font-semibold text-lg text-gray-200 mb-2 block">
               {{ page.features-title-small }}
               </span>
               <h2
                  class="
                  font-bold
                  text-3xl
                  sm:text-4xl
                  md:text-[40px]
                  text-gray-200
                  mb-4
                  "
                  >
                  {{ page.features-title }}
               </h2>
               <p class="text-2xl text-gray-200">
                  {{ page.features-subtitle }}
               </p>
            </div>
         </div>
      </div>
      <div class="flex flex-wrap justify-center -mx-4">
        {% for item in site.data.home.features %}
         <div class="w-full md:w-1/2 xl:w-1/3 px-4">
            <div
               class="
               bg-gradient-to-br from-[#1d162b] to-[#25183f]
               py-11
               px-6
               text-center
               group
               duration-200
               rounded-xl
               overflow-hidden
               relative
               hover:-translate-y-1
               mb-10
               "
               >
               <div
                  class="
                  mx-auto
                  mb-8
                  w-20
                  h-20
                  rounded-full
                  border border-indigo-500
                  text-gray-200
                  font-semibold
                  text-3xl
                  flex
                  items-center
                  justify-center
                  shadow-sm
                  group-hover:bg-indigo-500
                  group-hover:text-white
                  group-hover:border-indigo-500
                  "
                  >
                  <svg fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" class="md:h-6 md:w-6 h-4 w-4"><path d="{{ item.icon }}"></path></svg>
               </div>
               <h4 class="text-lg text-gray-200 font-semibold mb-4 uppercase">
                  {{ item.title }}
               </h4>
               <p class="text-base text-gray-300 leading-relaxed h-32">
                  {{ item.subtitle}}
               </p>
               <span
                  class="
                  absolute
                  bottom-0
                  left-0
                  h-2
                  w-0
                  bg-indigo-500
                  duration-200
                  block
                  group-hover:w-full
                  "
                  ></span>
            </div>
         </div>
         {% endfor %}
      </div>
   </div>
</section>
<!-- ====== Services Section End -->
