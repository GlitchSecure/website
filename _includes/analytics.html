<script
  defer
  data-domain="glitchsecure.com"
  src="https://metrics.glitchsecure.com/js/script.js"
></script>

<script>
  if (!window.plausible) {
    window.plausible = function() {
      window.plausible.q = window.plausible.q || []
      window.plausible.q.push(arguments)
    }
  }

  (() => {
    const acquisitionKey = "glitchsecure-acquisition"
    const bookingKey = "glitchsecure-booking-pending"
    const version = 2
    const acquisitionTtl = 90 * 24 * 60 * 60 * 1000
    const bookingTtl = 24 * 60 * 60 * 1000
    const utmKeys = ["source", "medium", "campaign", "content", "term"]
    const landingPage = "{{ page.url | default: '/' | escape }}"

    const isSavvyCalHost = hostname =>
      hostname === "savvycal.com" || hostname.endsWith(".savvycal.com")

    const normalizeUtm = value => {
      if (!value || /@|%40|:\/\//i.test(value)) return ""

      return value
        .toLowerCase()
        .trim()
        .slice(0, 100)
        .replace(/[^a-z0-9._~-]+/g, "-")
        .replace(/^-+|-+$/g, "")
    }

    const readJson = key => {
      try {
        return JSON.parse(localStorage.getItem(key))
      } catch {
        return null
      }
    }

    const removeStored = key => {
      try {
        localStorage.removeItem(key)
      } catch {}
    }

    const readAcquisition = () => {
      const stored = readJson(acquisitionKey)
      const valid =
        stored?.version === version && stored.expires_at > Date.now()

      if (!valid) removeStored(acquisitionKey)
      return valid ? stored : null
    }

    const campaignFrom = params => {
      const campaign = { landing_page: landingPage.slice(0, 200) }

      for (const key of utmKeys) {
        const value = normalizeUtm(params.get(`utm_${key}`))
        if (value) campaign[key] = value
      }

      return campaign
    }

    const externalReferrer = () => {
      try {
        const hostname = new URL(document.referrer).hostname.toLowerCase()

        if (
          !hostname ||
          hostname === location.hostname ||
          hostname === "glitchsecure.com" ||
          hostname.endsWith(".glitchsecure.com") ||
          isSavvyCalHost(hostname)
        ) return ""

        return normalizeUtm(hostname)
      } catch {
        return ""
      }
    }

    try {
      const acquisition = readAcquisition() || { version }
      const campaign = campaignFrom(new URLSearchParams(location.search))
      const hasCampaign = utmKeys.some(key => campaign[key])
      const referrer = externalReferrer()
      let captured = false

      if (hasCampaign) {
        acquisition.latest_campaign = campaign
        acquisition.latest_captured_at = Date.now()
        captured = true

        if (!acquisition.first_touch) {
          acquisition.first_touch = campaign
          acquisition.first_captured_at = Date.now()
        }
      } else if (!acquisition.first_touch && referrer) {
        acquisition.first_touch = {
          source: referrer,
          medium: "referral",
          landing_page: landingPage.slice(0, 200)
        }
        acquisition.first_captured_at = Date.now()
        captured = true
      }

      if (captured) {
        acquisition.expires_at = Date.now() + acquisitionTtl
        localStorage.setItem(acquisitionKey, JSON.stringify(acquisition))
      }
    } catch {}

    window.glitchAcquisitionProps = method => {
      const props = { method }
      const acquisition = readAcquisition()

      for (const [name, prefix] of [
        ["first_touch", "first_"],
        ["latest_campaign", "latest_"]
      ]) {
        for (const [key, value] of Object.entries(acquisition?.[name] || {})) {
          props[`${prefix}${key}`] = value
        }
      }

      return props
    }

    window.glitchTrackConversion = (eventName, method) => {
      try {
        window.plausible(eventName, {
          props: window.glitchAcquisitionProps(method)
        })
      } catch {}
    }

    const writeBookingPending = () => {
      try {
        localStorage.setItem(
          bookingKey,
          JSON.stringify({ expires_at: Date.now() + bookingTtl })
        )
      } catch {}
    }

    window.glitchTrackBooking = method => {
      const pending = readJson(bookingKey)
      removeStored(bookingKey)

      if (!pending || pending.expires_at <= Date.now()) return

      try {
        const hostname = new URL(document.referrer).hostname.toLowerCase()
        if (isSavvyCalHost(hostname)) {
          window.glitchTrackConversion("Get Started Booking", method)
        }
      } catch {}
    }

    window.glitchTrack404 = () => {
      try {
        window.plausible("404", {
          props: { path: location.pathname.slice(0, 200) }
        })
      } catch {}
    }

    document.addEventListener("click", event => {
      try {
        const target = event.target?.closest?.("[data-plausible-event]")
        if (target?.dataset.plausibleEvent === "Get Started Button") {
          window.glitchTrackConversion(
            "Get Started Button",
            target.dataset.plausibleMethod || "Website CTA"
          )
        }
      } catch {}
    })

    document.addEventListener("submit", event => {
      try {
        const target = event.target
        if (target?.dataset?.plausibleEvent === "Get Started Submission") {
          window.glitchTrackConversion(
            "Get Started Submission",
            target.dataset.plausibleMethod || "Get Started Form"
          )
          writeBookingPending()
        }
      } catch {}
    })
  })();

  /* Apollo analytics */
  (() => {
    try {
      const script = document.createElement("script")
      script.src =
        "https://assets.apollo.io/micro/website-tracker/tracker.iife.js" +
        "?nocache=" + Math.random().toString(36).substring(7)
      script.async = true
      script.defer = true
      script.onload = () => {
        try {
          window.trackingFunctions?.onLoad({
            appId: "688b91f5c7091b0011d359ca"
          })
        } catch {}
      }
      document.head.appendChild(script)
    } catch {}
  })();
</script>

<script
  defer
  src="https://static.cloudflareinsights.com/beacon.min.js"
  data-cf-beacon='{"token":"7f6e14211079465e8b005bc853c9901e"}'
></script>
